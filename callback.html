<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimalFinder — Подтверждение</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- tailwindcss CDN для быстрых стилей (необязательно) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans antialiased">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <!-- Блок для подтверждения email (по умолчанию скрыт) -->
        <div id="confirm-container" style="display: none;" class="text-center">
            <div class="text-green-600 text-5xl mb-4">✓</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Email подтверждён!</h2>
            <p class="text-gray-600 mb-6">Ваш адрес электронной почты успешно подтверждён. Теперь вы можете закрыть это окно и войти в приложение.</p>
            <button onclick="window.close()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150">Закрыть окно</button>
        </div>

        <!-- Блок для сброса пароля (по умолчанию скрыт) -->
        <div id="reset-container" style="display: none;" class="text-center">
            <div class="text-blue-600 text-5xl mb-4">🔑</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Сброс пароля</h2>
            <p class="text-gray-600 mb-6">Введите и подтвердите ваш новый пароль.</p>
            <div class="space-y-4 text-left">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">Новый пароль</label>
                    <input type="password" id="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button id="reset-password-btn" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150">Сохранить пароль</button>
            </div>
            <div id="reset-message" class="mt-4 text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://htusuxsjxxsudzxwjnvt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0dXN1eHNqeHhzdWR6eHdqbnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNjc5MjcsImV4cCI6MjA4MTc0MzkyN30.pBVCYJIGIYq71vQmBjxCrAYEOS8oqrphd16xCtTdABA';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Вспомогательная функция для получения параметров из URL ---
        function getUrlParams() {
            const params = new URLSearchParams(window.location.hash.substring(1) || window.location.search);
            return {
                access_token: params.get('access_token'),
                refresh_token: params.get('refresh_token'),
                token: params.get('token'),
                type: params.get('type')
            };
        }

        // --- Основная логика при загрузке страницы ---
        window.addEventListener('DOMContentLoaded', async () => {
            const params = getUrlParams();
            const confirmContainer = document.getElementById('confirm-container');
            const resetContainer = document.getElementById('reset-container');

            // 1. Обработка подтверждения email (type = 'signup')
            if (params.type === 'signup') {
                // Если мы здесь, значит Supabase уже подтвердил токен, просто показываем приятное сообщение
                confirmContainer.style.display = 'block';
                console.log('Email подтверждён!');
                return;
            }

            // 2. Обработка сброса пароля (type = 'recovery')
            if (params.type === 'recovery') {
                resetContainer.style.display = 'block';
                const newPasswordInput = document.getElementById('new-password');
                const confirmPasswordInput = document.getElementById('confirm-password');
                const resetButton = document.getElementById('reset-password-btn');
                const messageDiv = document.getElementById('reset-message');

                resetButton.addEventListener('click', async () => {
                    const newPassword = newPasswordInput.value;
                    const confirmPassword = confirmPasswordInput.value;
                    messageDiv.classList.add('hidden');

                    if (newPassword !== confirmPassword) {
                        showMessage('Пароли не совпадают', true);
                        return;
                    }
                    if (newPassword.length < 6) {
                        showMessage('Пароль должен содержать не менее 6 символов', true);
                        return;
                    }

                    resetButton.disabled = true;
                    resetButton.textContent = 'Сохранение...';

                    try {
                        // Устанавливаем сессию из параметров URL
                        if (!params.access_token) throw new Error('Не найден токен доступа в URL.');
                        await supabase.auth.setSession({
                            access_token: params.access_token,
                            refresh_token: params.refresh_token
                        });
                        // Обновляем пароль
                        const { error } = await supabase.auth.updateUser({ password: newPassword });
                        if (error) throw new Error(error.message);

                        showMessage('Пароль успешно изменён! Теперь вы можете закрыть это окно и войти.', false);
                        resetButton.disabled = true;
                        // Опционально: сбросить сессию, чтобы пользователь не остался в системе
                        await supabase.auth.signOut();
                    } catch (error) {
                        console.error('Ошибка при сбросе пароля:', error);
                        showMessage(error.message || 'Произошла ошибка при сбросе пароля.', true);
                        resetButton.disabled = false;
                        resetButton.textContent = 'Сохранить пароль';
                    }
                });
                return;
            }

            // Если тип не определён или неизвестен, показываем общее сообщение об ошибке
            confirmContainer.style.display = 'block';
            const h2 = confirmContainer.querySelector('h2');
            if (h2) h2.textContent = 'Неизвестная ссылка';
            const p = confirmContainer.querySelector('p');
            if (p) p.innerHTML = 'Возможно, ссылка устарела или неверна. Пожалуйста, запросите новое письмо.';
            document.querySelector('#confirm-container button').remove();
        });

        function showMessage(message, isError) {
            const messageDiv = document.getElementById('reset-message');
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden', 'text-red-600', 'text-green-600');
            messageDiv.classList.add(isError ? 'text-red-600' : 'text-green-600');
        }
    </script>
</body>
</html>
