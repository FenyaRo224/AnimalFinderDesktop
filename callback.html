<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimalFinder — Подтверждение</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans antialiased">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <!-- Блок для подтверждения email -->
        <div id="confirm-container" style="display: none;" class="text-center">
            <div class="text-green-600 text-5xl mb-4">✓</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Email подтверждён!</h2>
            <p class="text-gray-600 mb-6">Ваш адрес электронной почты успешно подтверждён. Теперь вы можете закрыть это окно и войти в приложение.</p>
            <button onclick="window.close()" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Закрыть окно</button>
        </div>

        <!-- Блок для сброса пароля -->
        <div id="reset-container" style="display: none;" class="text-center">
            <div class="text-blue-600 text-5xl mb-4">🔑</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Сброс пароля</h2>
            <p class="text-gray-600 mb-6">Введите и подтвердите ваш новый пароль.</p>
            <div class="space-y-4 text-left">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">Новый пароль</label>
                    <input type="password" id="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <button id="reset-password-btn" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Сохранить пароль</button>
            </div>
            <div id="reset-message" class="mt-4 text-sm text-red-600 hidden"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://htusuxsjxxsudzxwjnvt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0dXN1eHNqeHhzdWR6eHdqbnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNjc5MjcsImV4cCI6MjA4MTc0MzkyN30.pBVCYJIGIYq71vQmBjxCrAYEOS8oqrphd16xCtTdABA';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getUrlParams() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const searchParams = new URLSearchParams(window.location.search);
            return {
                access_token: hashParams.get('access_token') || searchParams.get('access_token'),
                refresh_token: hashParams.get('refresh_token') || searchParams.get('refresh_token'),
                type: hashParams.get('type') || searchParams.get('type'),
                token_hash: hashParams.get('token_hash') || searchParams.get('token_hash')
            };
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const params = getUrlParams();
            const confirmContainer = document.getElementById('confirm-container');
            const resetContainer = document.getElementById('reset-container');

            console.log('Параметры URL:', params);

            // Если тип не определён — пробуем определить по наличию access_token
            let effectiveType = params.type;
            if (!effectiveType && params.access_token) {
                const { data: { user } } = await supabase.auth.getUser(params.access_token);
                effectiveType = user ? 'recovery' : 'signup';
            }

            // Обработка сброса пароля
            if (effectiveType === 'recovery' || (params.token_hash && !params.type)) {
                resetContainer.style.display = 'block';
                
                const newPasswordInput = document.getElementById('new-password');
                const confirmPasswordInput = document.getElementById('confirm-password');
                const resetButton = document.getElementById('reset-password-btn');
                const messageDiv = document.getElementById('reset-message');

                resetButton.addEventListener('click', async () => {
                    const newPassword = newPasswordInput.value;
                    const confirmPassword = confirmPasswordInput.value;
                    messageDiv.classList.add('hidden');

                    if (newPassword !== confirmPassword) {
                        showMessage('Пароли не совпадают', true);
                        return;
                    }
                    if (newPassword.length < 6) {
                        showMessage('Пароль должен содержать не менее 6 символов', true);
                        return;
                    }

                    resetButton.disabled = true;
                    resetButton.textContent = 'Сохранение...';

                    try {
                        if (params.token_hash) {
                            const { error } = await supabase.auth.verifyOtp({
                                token_hash: params.token_hash,
                                type: 'recovery'
                            });
                            if (error) throw error;
                        }
                        
                        const { error } = await supabase.auth.updateUser({ password: newPassword });
                        if (error) throw error;

                        showMessage('Пароль успешно изменён! Теперь вы можете закрыть это окно.', false);
                        resetButton.disabled = true;
                        await supabase.auth.signOut();
                    } catch (error) {
                        showMessage(error.message, true);
                        resetButton.disabled = false;
                        resetButton.textContent = 'Сохранить пароль';
                    }
                });
                return;
            }

            // Обработка подтверждения email
            if (effectiveType === 'signup' || effectiveType === 'email_change' || (!effectiveType && params.token_hash)) {
                if (params.token_hash) {
                    try {
                        const { error } = await supabase.auth.verifyOtp({
                            token_hash: params.token_hash,
                            type: 'signup'
                        });
                        if (error) throw error;
                    } catch (error) {
                        console.warn('Ошибка верификации:', error);
                    }
                }
                confirmContainer.style.display = 'block';
                return;
            }

            // Если ничего не подошло — показываем подтверждение как запасной вариант
            confirmContainer.style.display = 'block';
        });

        function showMessage(message, isError) {
            const messageDiv = document.getElementById('reset-message');
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden', 'text-red-600', 'text-green-600');
            messageDiv.classList.add(isError ? 'text-red-600' : 'text-green-600');
        }
    </script>
</body>
</html>
